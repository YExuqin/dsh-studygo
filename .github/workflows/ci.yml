name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: for f in lib/*.js; do node --check "$f" || exit 1; done

      - name: 单元测试
        run: node --test "test/*.test.mjs"

      - name: 打包清单
        run: npm pack --dry-run
